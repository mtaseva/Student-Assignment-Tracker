name: Azure Deployment
on:
  push:
    branches:
      - main
permissions:
  id-token: write  # Important for OIDC authentication
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2
      
      # Log in to Azure using OIDC
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}       # Azure App registration client ID
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}       # Azure Directory tenant ID
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} # Azure Subscription ID

      # Deploy to Azure Web App
      - name: Deploy to Azure Web App
        run: |
          az webapp up --name student-tracker-web --resource-group StudentAssignmentTrackerRG --plan ASP-StudentAssignmentTrackerRG-b7e3 (F1: 1)
